name: Publish
on:
  release:
    types: [published]
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version matches tag
        run: |
          PKG_VERSION="v$(node -p 'require("./package.json").version')"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG" ]; then echo "Version mismatch: $PKG_VERSION != $TAG"; exit 1; fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # No dependency cache: this job holds an OIDC token that can publish,
          # so it must not restore state another run wrote. (setup-node@v4 only
          # caches when `cache` is set.)
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Trusted Publishing: npm exchanges this job's OIDC token (id-token: write)
      # for a short-lived publish credential, so no long-lived NPM_TOKEN exists to
      # expire or leak. Needs npm >= 11.5.1; Node 22 ships npm 10.
      # Pinned so a release run is reproducible; any npm >= 11.5.1 works.
      - run: npm install -g npm@11.21.1
      # Provenance is generated automatically under Trusted Publishing.
      - run: npm publish --access public
